<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Market</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Paprika&display=swap" rel="stylesheet">
</head>

<body>
  <main id="meteo" class="container">
    <section id="stand">
      <h1 class="paprika-regular">Bienvenue au Flower Market</h1>
      <div>
        <img src="img/photo_stand.png" id="standChange" alt="photo du stand">
      </div>
    </section>
    <section id="caisse">
      <p>Caisse : <span id="banque">0</span> €</p>
      <p>Temps: <span id="time">30</span>s</p>
      <button id="start-btn">Démarrer la journée</button>
    </section>
    <section id="fleurs">
      <div id="bacFleurs">
        <h2 id="flowerName"></h2>
        <p id="price">Bientôt ouvert !</p>
      </div>
    </section>
    <section id="client">
      <div id="customer">
        <p>Pas de client à l'horizon...</p>
      </div>
      <p id="totalClient"></p>
    </section>
  </main>
</body>
<script src="script.js"></script>

</html>
